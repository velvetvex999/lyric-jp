<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="description" content="SWAGなHIPHOP和訳サイト。海外HIPHOPの歌詞、和訳、スラング、曲の意味を深掘り。">
<meta property="og:title" content="LYRIC JP — SWAG HIPHOP">
<meta property="og:description" content="海外HIPHOPの歌詞・和訳・スラングを日本語で。">
<title>LYRIC JP — SWAG HIPHOP</title>
<style>
:root{--bg:#080808;--card:#111;--card2:#151515;--line:#292929;--text:#f2f2f2;--muted:#858585;--dim:#555}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:"Helvetica Neue",-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;font-weight:300;letter-spacing:-.01em;padding-bottom:76px}a{text-decoration:none;color:inherit}button,input,textarea,select{font:inherit}
.header{position:sticky;top:0;z-index:50;background:#080808e8;border-bottom:1px solid var(--line);backdrop-filter:blur(18px)}.nav{height:62px;max-width:1180px;margin:auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;letter-spacing:.08em}.brand small{color:#666;font-size:9px;letter-spacing:.2em;margin-left:6px}.links{display:flex;gap:24px;font-size:9px;letter-spacing:.18em;color:#777}.links a:hover{color:#fff}.wrap{max-width:1180px;margin:auto;padding:0 20px}
.hero{padding:78px 0 48px}.eyebrow,.label{font-size:9px;letter-spacing:.22em;color:#777}.hero h1{font-size:clamp(47px,8vw,100px);line-height:.9;letter-spacing:-.055em;font-weight:300;margin:17px 0 25px}.hero h1 span{color:#666}.hero p{max-width:650px;color:#999;line-height:1.9;font-size:13px}.search{display:flex;max-width:720px;margin-top:29px}.search input{flex:1;min-width:0;background:#131313;color:#fff;border:1px solid #303030;border-right:0;border-radius:11px 0 0 11px;padding:16px;outline:none}.search button{border:0;background:#eee;color:#050505;border-radius:0 11px 11px 0;padding:0 23px;font-size:10px;font-weight:500;letter-spacing:.12em}
.section{margin-top:34px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:15px}.head h2{font-size:10px;letter-spacing:.22em;font-weight:400;margin:0}.head span{font-size:8px;color:#555;letter-spacing:.16em}.feature{min-height:330px;border:1px solid var(--line);border-radius:22px;overflow:hidden;position:relative;background:radial-gradient(circle at 78% 25%,#3b3b3b,transparent 28%),linear-gradient(135deg,#1c1c1c,#090909);padding:30px;display:flex;align-items:flex-end}.featureText{position:relative;z-index:2}.featureTitle{font-size:clamp(48px,7vw,82px);line-height:.85;letter-spacing:-.055em;margin:8px 0}.featureArtist{color:#aaa;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.song{min-height:190px;padding:19px;background:var(--card);border:1px solid var(--line);border-radius:17px;display:flex;flex-direction:column;justify-content:space-between;transition:.2s}.song:hover{transform:translateY(-3px);border-color:#4b4b4b}.song h3{font-size:24px;font-weight:300;letter-spacing:-.04em;margin:10px 0 6px}.songArtist{font-size:11px;color:#888}.songFoot{padding-top:11px;border-top:1px solid #242424;display:flex;justify-content:space-between;color:#666;font-size:8px;letter-spacing:.14em}.songFoot b{color:#fff}
.rail{display:flex;gap:11px;overflow:auto;scrollbar-width:none;padding-bottom:5px}.rail::-webkit-scrollbar{display:none}.artist{flex:0 0 190px;aspect-ratio:1;position:relative;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#1a1a1a}.artist img{width:100%;height:100%;object-fit:cover;filter:grayscale(1);transition:.25s}.artist:hover img{filter:none;transform:scale(1.04)}.artistInfo{position:absolute;bottom:0;left:0;right:0;padding:48px 14px 14px;background:linear-gradient(transparent,#000e)}.artistInfo small{font-size:8px;color:#aaa}.artistInfo strong{display:block;font-size:20px;font-weight:300;margin-top:3px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:20px}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{width:100%;background:#090909;color:#ddd;border:1px solid #303030;border-radius:8px;padding:12px;outline:none}.field:focus{border-color:#666}.full{grid-column:1/-1}.btn{background:#eee;color:#000;border:0;border-radius:8px;padding:11px 16px;font-size:10px;font-weight:500;letter-spacing:.08em}.btn.secondary{background:#191919;color:#aaa;border:1px solid #333}.btn.danger{background:#191919;color:#aaa;border:1px solid #333}.adminActions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.pairs{margin-top:12px}.pairEditor{display:grid;grid-template-columns:1fr 1fr 34px;gap:7px;margin-bottom:7px}.pairEditor input{width:100%;background:#090909;color:#ddd;border:1px solid #303030;border-radius:8px;padding:11px}.pairEditor button{background:#151515;color:#777;border:1px solid #333;border-radius:8px}.saved{margin-top:18px;border-top:1px solid #292929}.savedRow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #222}.savedRowTitle{font-size:13px}.savedRowMeta{font-size:9px;color:#666;margin-top:3px}
.article{max-width:820px;margin:auto;padding:58px 20px}.back{font-size:9px;color:#666;letter-spacing:.15em}.article h1{font-size:clamp(42px,7vw,76px);font-weight:300;line-height:.9;letter-spacing:-.05em;margin:25px 0 8px}.article .by{font-size:12px;color:#888}.lyrics{margin-top:48px}.lyricPair{padding:20px 0;border-bottom:1px solid #202020}.en{font-size:16px;line-height:1.7;color:#eee}.ja{font-size:13px;line-height:1.8;color:#777;margin-top:5px}.articleBlock{margin-top:42px}.articleBlock h2{font-size:9px;letter-spacing:.2em;color:#777;font-weight:400}.articleBlock p{font-size:13px;line-height:1.9;color:#aaa;white-space:pre-wrap}
.empty{padding:30px;text-align:center;color:#666;border:1px dashed #333;border-radius:14px;font-size:11px}
.bottom{position:fixed;z-index:60;left:0;right:0;bottom:0;height:66px;background:#0b0b0bf5;border-top:1px solid #292929;backdrop-filter:blur(18px);display:flex;justify-content:center;gap:42px;padding-top:11px}.bottom a{font-size:8px;color:#666;text-align:center;letter-spacing:.1em}.bottom b{display:block;color:#ddd;font-size:15px;margin-bottom:3px}
.toast{position:fixed;z-index:100;left:50%;bottom:84px;transform:translateX(-50%);background:#eee;color:#000;padding:10px 15px;border-radius:9px;font-size:10px;display:none}
@media(max-width:700px){.links{display:none}.hero{padding-top:57px}.hero h1{font-size:58px}.feature{min-height:280px;padding:23px;border-radius:19px}.grid{grid-template-columns:1fr 1fr}.song{min-height:175px;padding:16px}.song h3{font-size:20px}.artist{flex-basis:150px}.formGrid{grid-template-columns:1fr}.full{grid-column:auto}.pairEditor{grid-template-columns:1fr 1fr 30px}.bottom{gap:25px}}
</style>
</head>
<body>
<header class="header"><div class="nav"><a class="brand" href="#/">lyric jp<small>/ hiphop</small></a><nav class="links"><a href="#/latest">latest</a><a href="#/artists">artists</a><a href="#/trending">trending</a><a href="#/manage">manage</a></nav></div></header>
<div id="app"></div>
<nav class="bottom"><a href="#/"><b>⌂</b>HOME</a><a href="#/latest"><b>♫</b>LATEST</a><a href="#/artists"><b>◎</b>ARTISTS</a><a href="#/trending"><b>↗</b>TRENDING</a><a href="#/manage"><b>＋</b>MANAGE</a></nav>
<div id="toast" class="toast"></div>

<script>
const LS_S="lyricjp_complete_songs",LS_A="lyricjp_complete_artists";
const defaultArtists=[
{name:"Gunna",genre:"HIPHOP / TRAP",img:"https://images.unsplash.com/photo-1520699049698-acd2fccb8cc8?auto=format&fit=crop&w=900&q=80"},
{name:"Future",genre:"HIPHOP / TRAP",img:"https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?auto=format&fit=crop&w=900&q=80"},
{name:"Travis Scott",genre:"HIPHOP / RAP",img:"https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=900&q=80"},
{name:"Don Toliver",genre:"HIPHOP / R&B",img:"https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=900&q=80"}];
const seedSongs=[
{artist:"Ken Carson",title:"overseas",genre:"TRAP / RAGE",status:"NEW",lyrics:[],meaning:"",slang:""},
{artist:"Gunna / Future / Young Thug",title:"Pushin P",genre:"HIPHOP",status:"HOT",lyrics:[],meaning:"",slang:""},
{artist:"Future",title:"Mask Off",genre:"HIPHOP",status:"HOT",lyrics:[],meaning:"",slang:""}];
let artists=JSON.parse(localStorage.getItem(LS_A)||"null")||defaultArtists;
let songs=JSON.parse(localStorage.getItem(LS_S)||"null")||seedSongs;
let editId=null;

const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const slug=(a,t)=>encodeURIComponent((a+"-"+t).toLowerCase().replace(/\s+/g,"-"));
function save(){localStorage.setItem(LS_S,JSON.stringify(songs));localStorage.setItem(LS_A,JSON.stringify(artists))}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",1800)}
function songCard(x,i){return `<a class="song" href="#/song/${slug(x.artist,x.title)}" data-search="${esc((x.title+" "+x.artist+" "+x.genre).toLowerCase())}"><div><div class="label">${String(i+1).padStart(3,"0")} / ${esc(x.status||"HIPHOP")}</div><h3>${esc(x.title)}</h3><div class="songArtist">${esc(x.artist)}</div></div><div class="songFoot"><span>${esc(x.genre||"TRANSLATION")}</span><b>↗</b></div></a>`}
function artistCard(a){return `<a class="artist" href="#/artists/${encodeURIComponent(a.name)}"><img src="${esc(a.img)}" alt=""><div class="artistInfo"><small>${esc(a.genre)}</small><strong>${esc(a.name)}</strong></div></a>`}
function home(){
document.title="LYRIC JP — SWAG HIPHOP";
return `<div class="wrap"><section class="hero"><div class="eyebrow">SWAG HIPHOP TRANSLATIONS</div><h1>swagな<br><span>hiphop</span>和訳サイト</h1><p>海外HIPHOPの歌詞を、もっと深く。和訳だけじゃなく、スラング、パンチライン、背景まで日本語で。</p><div class="search"><input id="q" placeholder="アーティスト・曲名を検索"><button onclick="search()">search</button></div></section>
<section class="section"><div class="head"><h2>FEATURED</h2><span>NOW PLAYING</span></div><a class="feature" href="#/song/${slug("Ken Carson","overseas")}"><div class="featureText"><div class="label">LATEST TRANSLATION / 001</div><div class="featureTitle">overseas</div><div class="featureArtist">Ken Carson</div></div></a></section>
<section class="section" id="latest"><div class="head"><h2>LATEST TRANSLATIONS</h2><span>NEW</span></div><div class="grid" id="songGrid">${songs.map(songCard).join("")}</div><div class="empty" id="empty" style="display:none">該当する曲が見つかりません。</div></section>
<section class="section"><div class="head"><h2>POPULAR ARTISTS</h2><span>SWIPE →</span></div><div class="rail">${artists.map(artistCard).join("")}</div></section></div>`;
}
function latest(){document.title="Latest — LYRIC JP";return `<div class="wrap"><section class="hero"><div class="eyebrow">LATEST TRANSLATIONS</div><h1>latest<br><span>lyrics</span></h1></section><section class="section"><div class="grid">${songs.map(songCard).join("")}</div></section></div>`}
function artistsPage(){document.title="Artists — LYRIC JP";return `<div class="wrap"><section class="hero"><div class="eyebrow">ARTISTS</div><h1>artists<br><span>index</span></h1></section><section class="section"><div class="rail" style="flex-wrap:wrap;overflow:visible">${artists.map(artistCard).join("")}</div></section></div>`}
function artistPage(name){const a=artists.find(x=>x.name.toLowerCase()===decodeURIComponent(name).toLowerCase());const list=songs.filter(x=>x.artist.toLowerCase().includes((a?.name||decodeURIComponent(name)).toLowerCase()));return `<div class="article"><a class="back" href="#/artists">← ARTISTS</a><h1>${esc(a?.name||decodeURIComponent(name))}</h1><div class="by">${esc(a?.genre||"HIPHOP")}</div><div class="section"><div class="grid">${list.length?list.map(songCard).join(""):'<div class="empty">このアーティストの和訳はまだありません。</div>'}</div></div></div>`}
function songPage(id){const key=decodeURIComponent(id);const x=songs.find(s=>slug(s.artist,s.title)===key);if(!x)return `<div class="article"><div class="empty">曲が見つかりません。</div></div>`;document.title=`${x.title} — ${x.artist} 和訳 | LYRIC JP`;document.querySelector('meta[name="description"]').setAttribute("content",`${x.artist}「${x.title}」の歌詞和訳、スラング、曲の意味を解説。`);
return `<article class="article"><a class="back" href="#/latest">← BACK TO LATEST</a><div class="label" style="margin-top:25px">${esc(x.genre)} / ${esc(x.status)}</div><h1>${esc(x.title)}</h1><div class="by">${esc(x.artist)}</div><div class="lyrics">${(x.lyrics||[]).length?x.lyrics.map(p=>`<div class="lyricPair"><div class="en">${esc(p.en)}</div><div class="ja">${esc(p.ja)}</div></div>`).join(""):'<div class="empty">歌詞はまだ登録されていません。</div>'}</div>
${x.meaning?`<section class="articleBlock"><h2>MEANING</h2><p>${esc(x.meaning)}</p></section>`:""}${x.slang?`<section class="articleBlock"><h2>SLANG / EXPRESSIONS</h2><p>${esc(x.slang)}</p></section>`:""}</article>`}
function manage(){document.title="Manage — LYRIC JP";return `<div class="wrap"><section class="hero"><div class="eyebrow">PRIVATE CONTENT MANAGER</div><h1>manage<br><span>lyrics</span></h1><p>曲・和訳・アーティストをスマホから登録。保存するとサイトの一覧と個別ページに反映されます。</p></section>
<section class="panel"><div class="head"><h2>${editId!==null?"EDIT TRANSLATION":"NEW TRANSLATION"}</h2><span>CMS</span></div>
<div class="formGrid"><input class="field" id="fArtist" placeholder="アーティスト名"><input class="field" id="fTitle" placeholder="曲名"><input class="field" id="fGenre" placeholder="ジャンル / TRAP"><input class="field" id="fStatus" placeholder="タグ / NEW"><div class="full pairs"><div class="label">LYRIC PAIRS</div><div id="pairs"></div><button class="btn secondary" onclick="addPair()">＋ ADD LINE</button><div class="label" style="margin-top:8px">※ 英語 → 日本語訳を1セットずつ入力。掲載許諾を得た歌詞のみ掲載してください。</div></div><textarea class="field full" id="fMeaning" placeholder="曲の意味・解説" style="min-height:100px"></textarea><textarea class="field full" id="fSlang" placeholder="スラング・表現解説" style="min-height:100px"></textarea></div>
<div class="adminActions"><button class="btn" onclick="saveSong()">SAVE & PUBLISH</button><button class="btn secondary" onclick="resetForm()">CLEAR</button></div><div class="saved"><div class="label" style="margin-top:15px">REGISTERED SONGS</div><div id="savedList">${songs.map((x,i)=>`<div class="savedRow"><div><div class="savedRowTitle">${esc(x.title)}</div><div class="savedRowMeta">${esc(x.artist)} · ${(x.lyrics||[]).length} lines</div></div><div class="adminActions"><button class="btn secondary" onclick="editSong(${i})">EDIT</button><button class="btn danger" onclick="deleteSong(${i})">DELETE</button></div></div>`).join("")}</div></div></section>
<section class="panel" style="margin-top:12px"><div class="head"><h2>ARTIST MANAGER</h2><span>PHOTO</span></div><div class="formGrid"><input class="field" id="aName" placeholder="アーティスト名"><input class="field" id="aGenre" placeholder="ジャンル"><input class="field full" id="aImage" type="file" accept="image/*"></div><div id="aPreview"></div><div class="adminActions"><button class="btn" onclick="addArtist()">ADD ARTIST</button></div></section></div>`}
function trending(){const top=songs.slice(0,5);return `<div class="wrap"><section class="hero"><div class="eyebrow">TRENDING</div><h1>what's<br><span>moving</span></h1></section><section class="section"><div class="grid">${top.map(songCard).join("")}</div></section></div>`}
function render(){const app=document.getElementById("app"),h=location.hash||"#/";let out;if(h==="#/"||h==="#")out=home();else if(h==="#/latest")out=latest();else if(h==="#/artists")out=artistsPage();else if(h==="#/trending")out=trending();else if(h==="#/manage")out=manage();else if(h.startsWith("#/song/"))out=songPage(h.slice(7));else if(h.startsWith("#/artists/"))out=artistPage(h.slice(10));else out=home();app.innerHTML=out;if(h==="#/manage"){if(editId!==null)loadEdit();else addPair()}window.scrollTo(0,0)}
function addPair(en="",ja=""){const box=document.getElementById("pairs");if(!box)return;const d=document.createElement("div");d.className="pairEditor";d.innerHTML=`<input class="enInput" placeholder="English lyric" value="${esc(en)}"><input class="jaInput" placeholder="日本語訳" value="${esc(ja)}"><button onclick="this.parentElement.remove()">×</button>`;box.appendChild(d)}
function loadEdit(){const x=songs[editId];if(!x)return;["fArtist","fTitle","fGenre","fStatus","fMeaning","fSlang"].forEach((id,i)=>document.getElementById(id).value=[x.artist,x.title,x.genre,x.status,x.meaning,x.slang][i]||"");(x.lyrics||[]).forEach(p=>addPair(p.en,p.ja))}
function saveSong(){const artist=fArtist.value.trim(),title=fTitle.value.trim();if(!artist||!title){toast("アーティスト名と曲名を入力してください");return}const lyrics=[...document.querySelectorAll(".pairEditor")].map(r=>({en:r.querySelector(".enInput").value.trim(),ja:r.querySelector(".jaInput").value.trim()})).filter(p=>p.en||p.ja);const x={artist,title,genre:fGenre.value.trim()||"HIPHOP",status:fStatus.value.trim()||"NEW",lyrics,meaning:fMeaning.value,slang:fSlang.value};if(editId===null)songs.unshift(x);else songs[editId]=x;save();editId=null;toast("保存しました");location.hash="#/song/"+slug(x.artist,x.title)}
function resetForm(){editId=null;location.hash="#/manage"}
function editSong(i){editId=i;location.hash="#/manage"}
function deleteSong(i){if(confirm("この曲を削除しますか？")){songs.splice(i,1);save();render();toast("削除しました")}}
function addArtist(){const n=aName.value.trim(),g=aGenre.value.trim()||"HIPHOP",file=aImage.files[0];if(!n||!file){toast("名前と写真を入力してください");return}const r=new FileReader();r.onload=()=>{artists.unshift({name:n,genre:g,img:r.result});save();toast("アーティストを追加しました");location.hash="#/artists"};r.readAsDataURL(file)}
function search(){const q=document.getElementById("q").value.toLowerCase().trim();document.querySelectorAll("#songGrid .song").forEach(e=>e.style.display=!q||e.dataset.search.includes(q)?"flex":"none");const vis=[...document.querySelectorAll("#songGrid .song")].some(e=>e.style.display!=="none");document.getElementById("empty").style.display=vis?"none":"block";document.getElementById("latest").scrollIntoView({behavior:"smooth"})}
window.addEventListener("hashchange",render);render();
</script>
</body></html>
